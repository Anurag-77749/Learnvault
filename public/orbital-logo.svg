<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nucleusGrad" x1="64" y1="64" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0" y1="128" x2="256" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="256" height="256" rx="56" fill="#0f172a"/>
  
  <!-- Outer Elliptical Orbit 1 -->
  <ellipse cx="128" cy="128" rx="100" ry="42" stroke="url(#orbitGrad1)" stroke-width="3" transform="rotate(-30 128 128)"/>
  <circle cx="214" cy="78" r="6" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Outer Elliptical Orbit 2 -->
  <ellipse cx="128" cy="128" rx="100" ry="42" stroke="url(#orbitGrad2)" stroke-width="3" transform="rotate(45 128 128)"/>
  <circle cx="58" cy="58" r="6" fill="#ec4899" filter="url(#glow)"/>

  <!-- Central Synaptic Nucleus -->
  <circle cx="128" cy="128" r="38" fill="url(#nucleusGrad)" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="32" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Stylized Neural Nodes inside Nucleus -->
  <circle cx="120" cy="120" r="5" fill="#ffffff"/>
  <circle cx="138" cy="124" r="4" fill="#a5f3fc"/>
  <circle cx="126" cy="138" r="4.5" fill="#fbcfe8"/>
  <line x1="120" y1="120" x2="138" y2="124" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="120" y1="120" x2="126" y2="138" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="138" y1="124" x2="126" y2="138" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
</svg>
