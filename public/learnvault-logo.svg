<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="lv-metal-top" x1="12" y1="6" x2="88" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A4A52" />
      <stop offset="50%" stop-color="#28282E" />
      <stop offset="100%" stop-color="#18181D" />
    </linearGradient>

    <linearGradient id="lv-metal-left" x1="12" y1="28" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2A30" />
      <stop offset="60%" stop-color="#151518" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>

    <linearGradient id="lv-metal-right" x1="88" y1="28" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="60%" stop-color="#111114" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <linearGradient id="lv-core-grad" x1="50" y1="36" x2="50" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#CC2200" />
    </linearGradient>

    <!-- Specular Rim Light -->
    <linearGradient id="lv-specular" x1="12" y1="6" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Core Bloom Filter -->
    <filter id="lv-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Disc -->
  <circle cx="50" cy="50" r="48" fill="#050507" />

  <!-- Background Chamfered Hexagon (The Solid Vault Body) -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="#0A0A0C"
    stroke="url(#lv-specular)"
    stroke-width="1.2"
  />

  <!-- Top Isometric Facet (Titanium Deck) -->
  <polygon
    points="50,10 84,30 50,48 16,30"
    fill="url(#lv-metal-top)"
    stroke="rgba(255,255,255,0.14)"
    stroke-width="0.8"
  />

  <!-- Left Isometric Facet (Architectural 'L' Pillar) -->
  <polygon
    points="16,32 48,49 48,89 16,69"
    fill="url(#lv-metal-left)"
    stroke="rgba(255,255,255,0.08)"
    stroke-width="0.8"
  />

  <!-- Right Isometric Facet (Converging 'V' Chevron) -->
  <polygon
    points="84,32 84,69 52,89 52,49"
    fill="url(#lv-metal-right)"
    stroke="rgba(255,255,255,0.08)"
    stroke-width="0.8"
  />

  <!-- Precision Micro-Etchings & Vernier Caliper Ticks -->
  <line x1="42" y1="20" x2="46" y2="18" stroke="#FF5500" stroke-width="1" stroke-opacity="0.9" />
  <line x1="54" y1="18" x2="58" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
  
  <line x1="22" y1="52" x2="38" y2="61" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
  <line x1="22" y1="57" x2="32" y2="62" stroke="#FF5500" stroke-width="0.8" stroke-opacity="0.8" />

  <line x1="62" y1="61" x2="78" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />

  <!-- Geometric Interlocking Monogram Path ('L' and 'V') -->
  <path
    d="M 28 42 L 36 46 L 36 68 L 46 73 L 44 76 L 28 68 Z"
    fill="#FF5500"
    fill-opacity="0.9"
  />

  <path
    d="M 72 42 L 56 68 L 54 68 L 60 76 L 76 50 Z"
    fill="#FFFFFF"
    fill-opacity="0.85"
  />

  <!-- Central Floating Radiant Core (The Vault Singularity) -->
  <g filter="url(#lv-glow)">
    <polygon
      points="50,38 60,50 50,62 40,50"
      fill="url(#lv-core-grad)"
    />
    <circle cx="50" cy="50" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Precision Laser Ring Orbit with Traveling Photon -->
  <circle
    cx="50"
    cy="50"
    r="38"
    stroke="rgba(255,85,0,0.3)"
    stroke-width="0.7"
    stroke-dasharray="3 3"
  />
  <circle cx="50" cy="12" r="1.8" fill="#FF5500" />
</svg>
